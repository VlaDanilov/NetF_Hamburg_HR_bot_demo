[project]
name = "hr-onboarding-agent"
version = "0.1.0"
description = "KI-Assistent für Onboarding-Fragen neuer Mitarbeitender (Demo, synthetische Daten)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk==2.11.0",
    "pypdf==6.20.1",
]

[dependency-groups]
dev = [
    "reportlab==5.0.1",  # generates the sample PDFs
    "pytest==9.1.1",
    "pyyaml==6.0.3",  # eval questions
    "python-dotenv==1.2.4",  # eval loads .env itself
    "ruff==0.17.0",
]

[tool.uv]
package = false  # application, not a library

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
